[tools]
java = "zulu-21"
node = "22"

[tasks.back-test-template]
description = "Run workbook template generator tests"
dir = "carpool-back"
run = "mvn -Dtest=WorkbookTemplateGeneratorTest,WorkbookTemplateCliTest,WorkbookTemplateCliJsonInputTest test"

[tasks.back-generate-template]
description = "Generate workbook template XLSX"
dir = "carpool-back"
run = "mvn -DskipTests exec:java -Dexec.mainClass=com.carpool.workbook.template.WorkbookTemplateCli"

[tasks.mcp-workbook]
description = "Start workbook MCP server (stdio)"
run = "node mcp/workbook-server.mjs"

[tasks.mcp-test]
description = "Run workbook MCP tests"
run = "npm run test:mcp"
